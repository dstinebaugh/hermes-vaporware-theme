# Vaporware - 80s retro vaporwave dashboard theme for Hermes. Made for The Manor / Gizmo by dstinebaugh.
# Fonts are bundled inline (no network fetch, works offline), same approach as
# mykeura/minimalist-themes-for-hermes: latin-subset WOFF2 embedded as base64
# @font-face rules. Here they ride in typography.fontUrl as a data: stylesheet,
# because the dashboard caps customCSS at 32 KB.
#   monofur is NOT bundled yet: it is used if installed locally, otherwise Hack.
#   Hack v3.003 (c) Source Foundry Authors - MIT + Bitstream Vera License
name: vaporware
label: Vaporware
description: 80s retro vaporwave (monofur UI, Hack for chat and code)

palette:
  background:
    hex: "#0a0612"
    alpha: 1.0
  midground:
    hex: "#e6dcff"
    alpha: 1.0
  foreground:
    hex: "#ffffff"
    alpha: 0
  warmGlow: "rgba(0, 240, 255, 0.18)"
  noiseOpacity: 1

typography:
  fontSans: "'monofur', 'Hack', 'JetBrains Mono', Consolas, monospace"
  fontMono: "'Hack', 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace"
  fontDisplay: "'monofur', 'Hack', 'JetBrains Mono', Consolas, monospace"
  fontUrl: "data:text/css;base64,"
  baseSize: "14px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0"
  density: comfortable

colorOverrides:
  card: "#1a1030"
  cardForeground: "#e6dcff"
  border: "#3d2a5c"
  input: "#3d2a5c"
  muted: "#1a1030"
  mutedForeground: "#8a7aa8"
  primary: "#ff2bd6"
  primaryForeground: "#0a0612"
  accent: "#00f0ff"
  accentForeground: "#0a0612"
  ring: "#00f0ff"
  destructive: "#ff3860"
  destructiveForeground: "#0a0612"
  success: "#39ff14"
  warning: "#ffe600"

customCSS: |
  a {
    text-shadow: 0 0 7px rgba(0, 240, 255, 0.35);
  }
  /* Hack for chat sidebar events, context/tool output, logs and code */
  pre, code, kbd, samp, textarea, .font-mono {
    font-family: var(--theme-font-mono) !important;
  }
