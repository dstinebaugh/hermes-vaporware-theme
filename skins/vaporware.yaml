# Vaporware TUI skin for Hermes Agent. Made for The Manor / Gizmo by dstinebaugh.
# Skins set colors and branding only; the TUI font comes from your terminal.
name: vaporware
description: Vaporware - retro neon theme (midnight background, teal/cyan primary, subtle purple borders).

branding:
  agent_name: Gizmo
  welcome: "Welcome to The Manor."
  goodbye: "Gizmo signing off."
  response_label: "Gizmo>"
  prompt_symbol: ">"
  help_header: "Gizmo Commands"

colors:
  # surfaces and dark fills
  status_bar_bg: "#0a0612"
  status_bar_text: "#e6dcff"
  status_bar_strong: "#2de2e6"
  status_bar_dim: "#8a9bb0"
  status_bar_good: "#39ff14"
  status_bar_warn: "#ffe600"
  status_bar_bad: "#ff3860"
  status_bar_critical: "#ff3860"
  voice_status_bg: "#0a0612"
  completion_menu_bg: "#1a1030"
  completion_menu_current_bg: "#1f5f63"
  completion_menu_meta_bg: "#1a1030"
  completion_menu_meta_current_bg: "#1f5f63"
  selection_bg: "#1f3f4a"
  # foregrounds and text
  banner_text: "#e6dcff"
  banner_border: "#4a3870"
  banner_title: "#2de2e6"
  banner_accent: "#00f0ff"
  banner_dim: "#8a9bb0"
  ui_accent: "#00f0ff"
  ui_label: "#2de2e6"
  ui_ok: "#39ff14"
  ui_error: "#ff3860"
  ui_warn: "#ffe600"
  # prompts, headers, banner; error/success/warning statuses
  prompt: "#2de2e6"
  input_rule: "#4a3870"
  response_border: "#4a3870"
  session_label: "#2de2e6"
  session_border: "#4a3870"
  shell_dollar: "#2de2e6"
